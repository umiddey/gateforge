# Publishes every workspace package to the public npm registry on a semver
# tag (v0.2.0 → 0.2.0) via npm TRUSTED PUBLISHING: the workflow's short-lived
# OIDC token authenticates the push — no NPM_TOKEN secret exists or is needed.
# One-time bootstrap: the packages' FIRST version is published manually
# (npm run publish:all); then register this workflow as the trusted
# publisher on each package: npmjs.com → package → Settings → Trusted
# Publisher → umiddey/gateforge, workflow publish.yml.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      # Trusted Publishing (OIDC-authenticated PUT) requires npm >= 11.5;
      # node 24 may ship older — pin npm explicitly.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build --workspaces --if-present
      # Apache-2.0 requires the license text to ship with each package.
      - run: npm run license:sync
      - run: bash scripts/release-publish.sh
