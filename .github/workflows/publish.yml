# Publishes every workspace package to the public npm registry on a semver
# tag (v0.2.0 → 0.2.0) via npm TRUSTED PUBLISHING: the workflow's short-lived
# OIDC token authenticates the push — no NPM_TOKEN secret exists or is needed.
# Publishing path: this workflow — a `v*` tag — is the release. A manual
# `npm publish` from a working tree where the Python detectors have run ships
# their bytecode caches; that is how 0.8.0 reached npm carrying
# `python/**/__pycache__/*.pyc` in four tarballs. Every manifest that ships a
# `python` directory now ends its `files` list with `!**/__pycache__`,
# `!**/*.pyc` and `!**/*.pyo`, and scripts/release-publish.sh refuses the whole
# release — before publishing anything — when `npm pack --dry-run --json
# --workspaces` still names one, printing the package and the path. For a
# release that is not on the registry yet, publish the `.tgz` files that the
# same command has just verified.
#
# Every publishing path in this repository goes through that refusal: this
# workflow runs `bash scripts/release-publish.sh`, `npm run publish:all` runs
# the same script (build → licenses → publish, skipping whatever is already on
# the registry), and `npm run pack:check` prints the packed file lists and then
# runs `bash scripts/release-publish.sh check`, which verifies them and
# publishes nothing. A hand-written `npm publish` is the only way past it, and
# it is not a release path.
#
# One-time bootstrap: the packages' FIRST version is published with `npm run
# publish:all`; then register this workflow as the trusted publisher on each
# package: npmjs.com → package → Settings → Trusted Publisher →
# umiddey/gateforge, workflow publish.yml. Because that script publishes with
# `--provenance`, the very first publish needs an environment where npm can
# mint provenance (this workflow, or another supported CI environment); a
# plain local `npm login` session cannot, and the run stops there rather than
# publishing.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      # Trusted Publishing (OIDC-authenticated PUT) requires npm >= 11.5;
      # node 24 may ship older — pin npm explicitly.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build --workspaces --if-present
      # Apache-2.0 requires the license text to ship with each package.
      - run: npm run license:sync
      - run: bash scripts/release-publish.sh
