# Committed consumer fixture configuration. The policy and adapter bytes are
# owner-reviewed inputs; an approved policy pin is still required for strict
# managed enforcement and is never supplied by this repository.
schemaVersion: 1
project:
  languages: [javascript]
  paths:
    include: ['server.js', 'e2e/**/*.js', 'fixtures/**/*.mjs']
    # The fixture/actor provider is ENGINE-SIDE harness code: the witness
    # loads it through GATEFORGE_FIXTURE_PROVIDER and the suite never sees
    # it. Its HTTP calls provision fixture subjects, so scanning it as
    # product frontend would report the engine's own provisioning traffic
    # as unresolved application call sites.
    exclude: ['node_modules/**', 'fixtures/fixture-provider.mjs']
plugins:
  - id: gateforge.pack-http
    version: '0.4.1'
    transport: in-process
    module: '@gate-forge/pack-http'
  - id: gateforge.behavior-fixture
    version: '1.0.0'
    transport: in-process
    module: './fixtures/fixture-detector.mjs'
policies: .gateforge/policies.yml
classificationPolicy: .gateforge/classification-policy.yml
adapters: .gateforge/adapters
waivers: .gateforge/waivers
baselines: .gateforge/baselines/obligations.json
# Machine-wide scanner settings (0.11.0), moved out of
# .gateforge/classification-policy.yml. The fixture/actor provider is
# engine-side harness code (loaded through GATEFORGE_FIXTURE_PROVIDER,
# never by the suite), so it is not classified as product source — see
# the matching project exclude above.
scan:
  scanRoots: ['server.js', 'e2e/**/*.js', 'fixtures/fixture-detector.mjs']
  declarations:
    internality: gateforge:internal
    archiveState: gateforge:archive-state
  volatileFields: []
behaviorPolicy: .gateforge/behavior.yml
changed:
  provider: auto
witness:
  maxDurationSeconds: 30
clock:
  mode: fixed
  fixedAt: '2026-01-01T00:00:00.000Z'
