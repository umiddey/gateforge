schemaVersion: 1
trustedInternalEntryPoints: []
internalRules: []
planes:
  rules:
    - match: server.js
      plane: tenant
      reason: All three profile, admin, and import surfaces in this reference app operate on tenant-scoped accounts.
endpoints:
  rules:
    - paths:
        - /profile/accounts/:id
      method: POST
      capability: crud-update
      reason: The profile POST edits an existing account selected by id.
    - paths:
        - /admin/accounts/:id
      method: POST
      capability: crud-update
      reason: The admin POST edits an existing account selected by id.
    - paths:
        - /imports/accounts
      method: POST
      capability: file-transfer
      reason: The import endpoint owns the explicit bulk account ingest channel; multipart remains typed unsupported.
    - paths:
        - /profile/accounts
        - /admin/accounts
        - /imports/accounts
        - /api/accounts
        - /api/accounts/:id
        - /profile/accounts/:id/edit
        - /admin/accounts/:id/edit
      method: GET
      capability: crud-read
      reason: These routes are read-only list/detail/editor surfaces for the fixture inventory.
