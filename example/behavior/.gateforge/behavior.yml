        action:
          kind: request
          method: POST
          pathTemplate: /imports/accounts
          path: {}
          query: {}
          body:
            encoding: json
            fields:
              rows:
                from: literal
                value:
                  - {first_name: Katherine, last_name: Johnson}
                  - {first_name: Dorothy, last_name: Vaughan}
          credentialVariant: valid
        expect:
          statuses: [200]
          response: []
          state:
            - kind: created
              scope: accounts
              rows:
                - fields:
                    first_name: {from: request, attempt: 0, pointer: /body/rows/0/first_name, transform: identity}
                    last_name: {from: request, attempt: 0, pointer: /body/rows/0/last_name, transform: identity}
                - fields:
                    first_name: {from: request, attempt: 0, pointer: /body/rows/1/first_name, transform: identity}
