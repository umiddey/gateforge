# Complete behavior coverage for the three separate user-facing surfaces.
# All mutations use the supported engine-http driver. The browser overlay
# remains a separate consumer fixture and does not claim spreadsheet proof.
#
# Every discovered endpoint is declared here — a complete-behavior document
# has no silent gap, so an undeclared route blocks with
# ENDPOINT_BEHAVIOR_MISSING. The seven read routes are declared as
# `http:read-result-verified` cases, not dispositions: the engine drives the
# read and checks the returned entity against its own scope snapshot, which
# is stronger than declaring a route out of scope.
schemaVersion: 1
endpoints:
  # --- Read surfaces: the same accounts table, read through four routes ---
  - resourceId: tenant.http-get-profile-accounts-d1960ba9
    effects:
      - id: accounts
        resourceId: tenant.accounts
        adapter: accounts
        scope: fixture-accounts
        identityFields: [id]
        fields: [first_name, last_name, status]
        completion: immediate
    cases:
      - id: profile-list-reads-accounts
        contract: http:read-result-verified
        channel: engine-http
        fixture: two-tenants-two-accounts
        actor: owner-a
        action:
          kind: request
          method: GET
          pathTemplate: /profile/accounts
          path: {}
          query: {}
          body: {encoding: json, fields: {}}
          credentialVariant: valid
        expect:
          statuses: [200]
          response:
            # The profile list is a server-rendered page: the engine's read
            # proof is that the route returned a real rendered body AND left
            # the store untouched.
            - kind: envelope
              schema: {type: string, minLength: 1, maxLength: 1000000}
          # A read must leave the store exactly as it found it.
          state:
            - kind: unchanged
              scope: accounts
